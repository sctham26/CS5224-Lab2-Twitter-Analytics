<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS5224 Twitter Analytics</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ddd;
        }

        h1 {
            text-align: center;
            color: #232f3e;
        }

        .user {
            padding: 20px;
            margin-top: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .user h2 {
            color: #0073bb;
        }

        p {
            font-size: 17px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Twitter User Statistics</h1>
        <div id="results"></div>
    </div>


<script>
    const API_URL =
        "https://bsjrc2au9j.execute-api.ap-southeast-1.amazonaws.com/stats";

    async function loadStatistics() {
        const results = document.getElementById("results");

        results.textContent = "Loading statistics...";

        try {
            const response = await fetch(API_URL);

            if (!response.ok) {
                throw new Error(
                    "HTTP error: " + response.status
                );
            }

            const users = await response.json();

            results.innerHTML = "";

            users.forEach(user => {
                const div = document.createElement("div");
                div.className = "user";

                const heading = document.createElement("h2");
                heading.textContent = "User " + user.user_id;

                const followers = document.createElement("p");
                followers.textContent =
                    user.user_id + " has " +
                    user.followers + " followers";

                const followees = document.createElement("p");
                followees.textContent =
                    user.user_id + " has " +
                    user.followees + " followees";

                div.append(heading, followers, followees);
                results.appendChild(div);
            });

        } catch (error) {
            results.textContent =
                "Failed to retrieve user statistics.";
            console.error(error);
        }
    }

    loadStatistics();
</script>

</body>
</html>
